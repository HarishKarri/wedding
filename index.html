<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hari &amp; Rashmi Wedding</title>
  <meta name="description" content="Photos from Hari and Rashmi's wedding.">
  <!-- Keeps search engines from listing the site. Remove this line if you want it public in search. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf8f6">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#grid">Skip to photos</a>

  <!-- Full-screen cover -->
  <header class="cover" id="cover">
    <div class="cover-photo" id="cover-photo" aria-hidden="true"></div>
    <p class="cover-credit" id="cover-credit"></p>
    <div class="cover-text">
      <h1 id="cover-title">Hari &amp; Rashmi Wedding</h1>
      <p class="cover-date" id="cover-date"></p>
      <a class="cover-link" href="#gallery" id="cover-link">View gallery</a>
    </div>
  </header>

  <!-- Gallery -->
  <div class="gallery" id="gallery">
    <div class="bar" id="bar">
      <div class="brand">
        <p class="brand-title" id="brand-title">Hari &amp; Rashmi Wedding</p>
        <p class="brand-sub" id="brand-sub"></p>
      </div>

      <nav class="nav" id="nav" aria-label="Albums">
        <div class="tabs" id="tabs"></div>
        <div class="more" id="more" hidden>
          <button class="more-btn" id="more-btn" type="button" aria-haspopup="true" aria-expanded="false">
            More
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu" id="more-menu" hidden></div>
        </div>
      </nav>

      <div class="actions">
        <button class="icon-btn" id="share" type="button" aria-label="Share this gallery" title="Share">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 21.5 10.5 15 16.5v-3.5c-5.5 0-9 1.5-12 6 .8-6 4.8-9.5 12-10V4.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="slideshow" type="button" aria-label="Play slideshow" title="Slideshow" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <main id="main">
      <div class="masonry" id="grid"></div>
      <p class="empty" id="empty" hidden>
        No albums yet. Add photos to the <code>originals</code> folder and run
        <code>python3 build_gallery.py</code>.
      </p>
    </main>

    <footer class="footer">
      <p id="credit"></p>
    </footer>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
